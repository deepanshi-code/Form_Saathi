<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Saathi</title>
  <meta name="description" content="Understand Indian official forms field by field, in simple English and Hindi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Mukta covers both Latin and Devanagari, so English and Hindi look like one family -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a href="#" class="brand" id="home-link">
        <span class="brand-mark" aria-hidden="true">स</span>
        <span>Form Saathi</span>
      </a>
      <!-- Language toggle: the app re-renders all text when this changes -->
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="hi">हिंदी</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- View 1: home (search, recent changes, form cards) -->
    <section id="list-view">
      <div class="hero">
        <h1 data-text="tagline"></h1>
        <p class="hero-sub" data-text="intro"></p>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="search" autocomplete="off">
        </label>
      </div>

      <div id="changes-banner"></div>
      <div id="chips" class="chips" role="group"></div>
      <div id="form-grid" class="form-grid"></div>
    </section>

    <!-- View 2: one form in fill-along mode (hidden until a form is picked) -->
    <section id="form-view" hidden>
      <button type="button" class="back" id="back-btn" data-text="back"></button>
      <!-- Medium screens: summary | fields. Wide screens: summary | field list | open field -->
      <div class="form-layout">
        <aside class="form-side">
          <div id="form-header"></div>
          <div id="form-progress"></div>
          <div id="form-sections"></div>
        </aside>
        <ol id="field-list" class="field-list"></ol>
        <article id="field-detail" class="field-detail" aria-live="polite"></article>
      </div>
    </section>
  </main>

  <footer class="wrap footer" data-text="disclaimer"></footer>

  <!-- Order matters: the registry first, then each form file, then the catalog and the app -->
  <script src="forms/registry.js"></script>
  <script src="forms/sbi-account-opening.js"></script>
  <script src="forms/pnb-account-opening.js"></script>
  <script src="forms/bob-account-opening.js"></script>
  <script src="forms/hdfc-account-opening.js"></script>
  <script src="forms/post-office-savings.js"></script>
  <script src="forms/pmjdy-account.js"></script>
  <script src="forms/pan-application.js"></script>
  <script src="forms/aadhaar-update.js"></script>
  <script src="forms/voter-id-form-6.js"></script>
  <script src="forms/voter-id-form-8.js"></script>
  <script src="forms/learner-licence.js"></script>
  <script src="forms/passport-fresh.js"></script>
  <script src="forms/uk-income-certificate.js"></script>
  <script src="forms/uk-caste-certificate.js"></script>
  <script src="forms/uk-domicile-certificate.js"></script>
  <script src="forms/nsp-scholarship.js"></script>
  <script src="forms/pm-vidyalaxmi-loan.js"></script>
  <script src="forms/ugc-anti-ragging.js"></script>
  <script src="forms/catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
